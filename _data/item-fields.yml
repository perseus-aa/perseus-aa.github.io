# Which metadata fields an item page shows, and in what order, by object type (objtype).
# Read by _includes/item/metadata.html. A type that is not listed here uses `default`.
#
# facts:    short labeled fields, shown in the card beside the images
#   - key:   metadata column to show
#     label: label shown before the value
#     mod:   (optional) column holding a modifier shown before the value, e.g. "attributed to"
#   - special: date        the date range, from start_/end_/unitary_ columns
#   - special: collection  collection, accession number, and collection history
#   - special: original_or_copy  original or copy; for a copy, names the original if known ("Copy of ...")
#
# sections: prose, shown full width below the images, one heading per section
#   - label: heading
#     keys:  columns shown under the heading, in order; the section is omitted if all are empty
#     filter: (optional) essay_markup or see_also_links, to turn embedded markup into HTML
#             (_plugins/perseus_markup.rb)
#
# Citations and bibliography are the same for every type (see metadata.html).

Vase:
  facts:
    - {key: beazley_number, label: Beazley Number}
    - {key: ware, label: Ware}
    - {key: shape, label: Shape}
    - {key: painter, label: Painter, mod: painter_mod}
    - {key: potter, label: Potter, mod: potter_mod}
    - {key: attributed_by, label: Attributed By}
    - {special: date}
    - {key: period, label: Period}
    - {key: ceramic_phase, label: Ceramic Phase}
    - {key: context, label: Context, mod: context_mod}
    - {key: findspot, label: Findspot, mod: findspot_mod}
    - {key: region, label: Region}
    - {key: dimensions, label: Dimensions}
    - {key: condit, label: Condition}
    - {special: collection}
    - {key: donor, label: Donor}
  sections:
    - {label: Date Description, keys: [date_description]}
    - {label: Shape Description, keys: [shape_description]}
    - {label: Decoration Description, keys: [decoration_description, relief]}
    - {label: Material Description, keys: [material_description]}
    - {label: Graffiti, keys: [graffiti, inscriptions]}
    - {label: Notes, keys: [comparanda]}
    - {label: Essay, keys: [essay_text], filter: essay_markup}

Sculpture:
  facts:
    - {key: sculptor, label: Sculptor, mod: sculptor_mod}
    - {key: sculpture_type, label: Type}
    - {key: category, label: Category}
    - {special: original_or_copy}
    - {key: style, label: Style}
    - {key: material, label: Material}
    - {key: technique, label: Technique}
    - {key: object_function, label: Function}
    - {key: scale, label: Scale}
    - {key: dimensions, label: Dimensions}
    - {special: date}
    - {key: period, label: Period}
    - {key: context, label: Context, mod: context_mod}
    - {key: findspot, label: Findspot, mod: findspot_mod}
    - {key: region, label: Region}
    - {key: placement, label: Placement}
    - {key: in_group, label: In Group}
    - {key: in_whole, label: In Whole}
    - {key: assoc_building, label: Associated Building}
    - {key: condit, label: Condition}
    - {special: collection}
    - {key: donor, label: Donor}
  sections:
    - {label: Date Description, keys: [date_description]}
    - {label: Form and Style, keys: [form_style_description]}
    - {label: Material Description, keys: [material_description]}
    - {label: Technique Description, keys: [technique_description]}
    - {label: Subject Description, keys: [subject_description]}
    - {label: Condition Description, keys: [condition_description]}
    - {label: Inscription, keys: [inscription, inscription_bibliography]}
    - {label: Documentary References, keys: [documentary_references]}
    - {label: Notes, keys: [other_notes]}

Coin:
  facts:
    - {key: denomination, label: Denomination}
    - {key: material, label: Material}
    - {key: issuing_authority, label: Issuing Authority}
    - {special: date}
    - {key: period, label: Period}
    - {key: context, label: Context, mod: context_mod}
    - {key: region, label: Region}
    - {key: actual_weight, label: Actual Weight}
    - {key: die_axis, label: Die Axis}
    - {key: dimensions, label: Dimensions}
    - {key: obverse_type, label: Obverse Type}
    - {key: obverse_legend, label: Obverse Legend}
    - {key: reverse_type, label: Reverse Type}
    - {key: reverse_legend, label: Reverse Legend}
    - {special: collection}
    - {key: donor, label: Donor}
  sections:
    - {label: Date Description, keys: [date_description]}
    - {label: Commentary, keys: [commentary]}

Building:
  facts:
    - {key: building_type, label: Type}
    - {key: architect, label: Architect}
    - {key: architectural_order, label: Architectural Order}
    - {special: date}
    - {key: period, label: Period}
    - {key: context, label: Context, mod: context_mod}
    - {key: region, label: Region}
    - {key: dimensions, label: Dimensions}
  sections:
    - {label: Date Description, keys: [date_description]}
    - {label: Plan, keys: [plan]}
    - {label: History, keys: [history]}
    - {label: Evidence for the Architect, keys: [architect_evidence]}
    - {label: Documentary References, keys: [documentary_references]}
    - {label: Notes, keys: [other_notes]}
    - {label: See Also, keys: [see_also], filter: see_also_links}

Gem:
  facts:
    - {key: sculpture_type, label: Type}
    - {key: material, label: Material}
    - {key: style, label: Style}
    - {key: culture, label: Culture}
    - {special: date}
    - {key: dimensions, label: Dimensions}
    - {special: collection}
    - {key: donor, label: Donor}
  sections:
    - {label: Material Description, keys: [material_description]}

Site:
  facts:
    - {key: site_type, label: Type}
    - {key: region, label: Region}
    - {key: periods, label: Periods}
  sections:
    - {label: Description, keys: [description]}
    - {label: Physical, keys: [physical]}
    - {label: Exploration, keys: [exploration]}

default:
  facts:
    - {special: date}
    - {key: period, label: Period}
    - {key: context, label: Context, mod: context_mod}
    - {key: region, label: Region}
    - {key: material, label: Material}
    - {key: dimensions, label: Dimensions}
    - {special: collection}
    - {key: donor, label: Donor}
  sections:
    - {label: Date Description, keys: [date_description]}
    - {label: Description, keys: [description]}
